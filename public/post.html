<!DOCTYPE html>
<html lang="hr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3F4A2E">
    <title id="page-title">PunPjat — Recept</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        paper: '#F6EFDD',
                        paperdark: '#1B1D14',
                        ink: '#2A2318',
                        inkdark: '#F1E9D8',
                        olive: '#3F4A2E',
                        olivedeep: '#2E361F',
                        saffron: '#E2A63B',
                        paprika: '#B8451F',
                        card: '#FFFCF4',
                        carddark: '#262A1C',
                    },
                    fontFamily: {
                        serif: ['"Instrument Serif"', 'Georgia', 'serif'],
                        sans: ['"Work Sans"', 'sans-serif'],
                        mono: ['"Space Mono"', 'monospace'],
                    },
                }
            }
        }
    </script>

    <style>
        :root { --page-bg: #F6EFDD; }
        .dark { --page-bg: #1B1D14; }

        /* Poderani/nazubljeni rub kartice-cedulje */
        .ticket { position: relative; }
        .ticket::after {
            content: "";
            position: absolute;
            left: 0; right: 0; bottom: -1px;
            height: 13px;
            background-image:
                linear-gradient(135deg, var(--page-bg) 50%, transparent 50%),
                linear-gradient(45deg, var(--page-bg) 50%, transparent 50%);
            background-size: 16px 16px;
            background-position: bottom left;
            background-repeat: repeat-x;
            pointer-events: none;
        }

        /* Pečat kategorije */
        .stamp {
            border: 2px dashed currentColor;
            transform: rotate(-4deg);
        }

        ::selection { background: #E2A63B; color: #2A2318; }

        :focus-visible {
            outline: 3px solid #E2A63B;
            outline-offset: 2px;
            border-radius: 4px;
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body class="bg-paper dark:bg-paperdark text-ink dark:text-inkdark font-sans antialiased min-h-screen flex flex-col justify-between transition-colors duration-300">

    <!-- Navigacija -->
    <header class="print:hidden bg-olive text-white sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="/" class="text-2xl font-serif italic tracking-tight flex items-center gap-2">
                <span aria-hidden="true">🍲</span> PunPjat
            </a>
            
            <div class="flex items-center gap-4">
                <a href="/" class="text-sm font-medium text-white/80 hover:text-saffron transition">
                    &larr; Natrag na recepte
                </a>
                <button onclick="toggleTheme()" class="p-2.5 rounded-full bg-white/10 hover:bg-white/20 transition" aria-label="Prebaci temu (svijetla/tamna)">
                    <svg id="sun-icon" class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    <svg id="moon-icon" class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path></svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Glavni sadržaj recepta -->
    <main class="max-w-4xl mx-auto px-6 py-12 flex-grow w-full">
        
        <!-- Zaglavlje recepta -->
        <div class="mb-8 text-center md:text-left">
            <div class="flex flex-wrap items-center justify-center md:justify-start gap-3 mb-4">
                <span id="recipe-category" class="stamp inline-block text-xs font-mono uppercase tracking-wider bg-card dark:bg-carddark text-ink dark:text-inkdark px-3 py-1 rounded-full">Kategorija</span>
                <span id="recipe-time" class="font-mono text-xs text-ink/60 dark:text-inkdark/60 hidden"></span>
            </div>
            <h1 id="recipe-title" class="text-4xl md:text-6xl font-serif tracking-tight mt-2 mb-4 leading-[1.1]">
                Učitavanje recepta...
            </h1>
            <p id="recipe-desc" class="text-base md:text-lg text-ink/70 dark:text-inkdark/70 max-w-2xl leading-relaxed">
                Molimo pričekajte trenutak dok dohvatimo podatke o jelu.
            </p>
            <button onclick="window.print()" class="print:hidden mt-6 inline-flex items-center gap-2 text-xs font-mono uppercase tracking-widest bg-paprika/10 hover:bg-paprika/20 dark:bg-saffron/10 dark:hover:bg-saffron/25 text-paprika dark:text-saffron px-4 py-2 rounded-md transition">
                🖨️ Isprintaj recept
            </button>
        </div>

        <!-- Slika recepta -->
        <div class="w-full h-72 md:h-[420px] bg-card dark:bg-carddark rounded-xl overflow-hidden mb-12 border-2 border-ink/15 dark:border-white/15 shadow-xl">
            <img id="recipe-image" src="" alt="Slika jela" class="w-full h-full object-cover">
        </div>

        <!-- Sastojci i Priprema -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            
            <!-- Sastojci -->
            <div class="ticket bg-card dark:bg-carddark p-6 md:p-8 rounded-xl border-2 border-ink/15 dark:border-white/15 shadow-md h-fit md:col-span-1">
                <h3 class="text-2xl font-serif mb-4 pb-3 border-b border-dashed border-ink/15 dark:border-white/15 flex items-center gap-2">
                    <span aria-hidden="true">🛒</span> Sastojci
                </h3>
                <ul id="recipe-ingredients" class="space-y-3 text-ink/80 dark:text-inkdark/80 text-sm">
                    <li class="text-ink/40 dark:text-inkdark/40 font-mono text-xs">Učitavanje sastojaka...</li>
                </ul>
            </div>

            <!-- Koraci pripreme -->
            <div class="ticket bg-card dark:bg-carddark p-6 md:p-8 rounded-xl border-2 border-ink/15 dark:border-white/15 shadow-md md:col-span-2">
                <h3 class="text-2xl font-serif mb-6 pb-3 border-b border-dashed border-ink/15 dark:border-white/15 flex items-center gap-2">
                    <span aria-hidden="true">👨‍🍳</span> Priprema
                </h3>
                <ol id="recipe-steps" class="space-y-6 text-ink/80 dark:text-inkdark/80 text-base">
                    <li class="text-ink/40 dark:text-inkdark/40 font-mono text-xs">Učitavanje koraka pripreme...</li>
                </ol>
            </div>

        </div>

    </main>

    <!-- Podnožje -->
    <footer class="print:hidden bg-olive text-white/80 mt-20">
        <div class="max-w-4xl mx-auto px-6 py-10 text-center text-xs font-mono">
            &copy; 2026 PUNPJAT — SVA PRAVA PRIDRŽANA
        </div>
    </footer>

    <!-- Skripte -->
    <script>
        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }
        initTheme();

        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
            }
        }

        async function ucitajPojedinacniRecept() {
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('slug');

            if (!slug) {
                document.getElementById('recipe-title').innerText = "Recept nije pronađen";
                document.getElementById('recipe-desc').innerText = "Niste odabrali valjani recept.";
                return;
            }

            try {
                let response = await fetch(`/api/post?slug=${encodeURIComponent(slug)}`);
                let r = await response.json();

                if (!response.ok) {
                    throw new Error(r?.error || `Recept nije pronađen (HTTP ${response.status}).`);
                }

                // Osiguraj da su ovo uvijek nizovi, čak i ako je u bazi NULL
                r.ingredients = Array.isArray(r.ingredients) ? r.ingredients : [];
                r.steps = Array.isArray(r.steps) ? r.steps : [];

                document.getElementById('page-title').innerText = `${r.title} — PunPjat`;
                document.getElementById('recipe-category').innerText = r.category || 'Recept';
                document.getElementById('recipe-title').innerText = r.title;
                document.getElementById('recipe-desc').innerText = r.description || '';
                
                if (r.prep_time) {
                    const timeEl = document.getElementById('recipe-time');
                    timeEl.textContent = `⏱ ${r.prep_time}`;
                    timeEl.classList.remove('hidden');
                }

                const slikaRecepta = r.image_url || 'https://images.unsplash.com/photo-1545231027-637d2f6610f8?auto=format&fit=crop&w=800&q=80';
                document.getElementById('recipe-image').src = slikaRecepta;

                let metaDesc = document.querySelector('meta[name="description"]');
                if (!metaDesc) {
                    metaDesc = document.createElement('meta');
                    metaDesc.setAttribute('name', 'description');
                    document.head.appendChild(metaDesc);
                }
                metaDesc.setAttribute('content', r.description || '');

                const jsonLd = {
                    "@context": "https://schema.org/",
                    "@type": "Recipe",
                    "name": r.title,
                    "image": [slikaRecepta],
                    "description": r.description,
                    "recipeCategory": r.category,
                    "author": {
                        "@type": "Person",
                        "name": r.author || "PunPjat"
                    },
                    "recipeIngredient": r.ingredients,
                    "recipeInstructions": r.steps.map(step => ({
                        "@type": "HowToStep",
                        "text": step
                    }))
                };
                if (r.prep_time) jsonLd.totalTime = r.prep_time;

                const scriptTag = document.createElement('script');
                scriptTag.type = 'application/ld+json';
                scriptTag.textContent = JSON.stringify(jsonLd);
                document.head.appendChild(scriptTag);

                let ingredientsList = document.getElementById('recipe-ingredients');
                ingredientsList.innerHTML = '';
                r.ingredients.forEach(ing => {
                    let li = document.createElement('li');
                    li.className = "flex items-start gap-2.5 border-b border-dashed border-ink/10 dark:border-white/10 pb-2.5 last:border-none";
                    li.innerHTML = `<span class="text-paprika dark:text-saffron font-bold">•</span> <span class="leading-snug">${ing}</span>`;
                    ingredientsList.appendChild(li);
                });

                let stepsList = document.getElementById('recipe-steps');
                stepsList.innerHTML = '';
                r.steps.forEach((step, index) => {
                    let li = document.createElement('li');
                    li.className = "leading-relaxed pb-4 border-b border-dashed border-ink/10 dark:border-white/10 last:border-none flex gap-4";
                    li.innerHTML = `<span class="font-serif text-2xl font-bold text-paprika dark:text-saffron leading-none">${index + 1}.</span> <span class="flex-grow pt-0.5">${step}</span>`;
                    stepsList.appendChild(li);
                });

            } catch (error) {
                console.error("Greška:", error);
                document.getElementById('recipe-title').innerText = "Greška";
                document.getElementById('recipe-desc').innerText = error.message || "Došlo je do pogreške prilikom dohvaćanja recepta.";
            }
        }

        window.onload = ucitajPojedinacniRecept;
    </script>
</body>
</html>
